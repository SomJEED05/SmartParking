        :root {
            --bg-color: #0b1329;
            --card-bg: #152238;

            --text-main: #ffffff;
            --text-sub: #8a99ad;
            --accent-blue: #3b82f6;
            --status-green: #10b981;
            --status-red: #ef4444;
            --status-yellow: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; min-height: 100vh; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header-title { font-size: 1.5rem; font-weight: bold; }
        .header-subtitle { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
        .badge-container { display: flex; gap: 10px; }
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .badge-offline { background: rgba(239, 68, 68, 0.2); color: var(--status-red); border: 1px solid var(--status-red); }
        .badge-online { background: rgba(16, 185, 129, 0.2); color: var(--status-green); border: 1px solid var(--status-green); }
        .badge-dot { width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px; position: relative; }
        .card-title { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px; }
        .card-val { font-size: 2rem; font-weight: bold; }
        .card-subtext { font-size: 0.75rem; color: var(--text-sub); margin-top: 8px; }

        .slots-card { grid-column: span 2; }
        .slots-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .slot-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px 10px; text-align: center; transition: all 0.3s; }
        .slot-icon { width: 44px; height: 44px; border-radius: 8px; background: var(--accent-blue); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; margin: 0 auto 10px auto; }
        .slot-box.occupied .slot-icon { background: var(--status-red); }
        .slot-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 4px; }
        .slot-time { font-size: 0.75rem; color: var(--text-sub); }

        .info-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-sub); }
        .no-data-tag { font-size: 0.8rem; color: var(--status-yellow); margin-top: 12px; display: inline-block; }

        .lcd-card { grid-column: span 4; }
        .lcd-screen { background: #061a0c; border: 3px solid #1c3822; border-radius: 8px; padding: 14px; font-family: 'Courier New', Courier, monospace; color: #33ff66; text-shadow: 0 0 5px rgba(51, 255, 102, 0.5); font-size: 1.05rem; line-height: 1.4; min-height: 110px; }

            .slots-card, .lcd-card { grid-column: span 2; }
