<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART PARKING — ZONE A</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; padding: 24px; min-height: 100vh; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header-title { font-size: 1.6rem; font-weight: bold; }
        .header-subtitle { font-size: 0.85rem; color: #8a99ad; margin-top: 4px; }
        .badge-container { display: flex; gap: 10px; }
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .badge-offline { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .badge-online { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        .badge-dot { width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
        .card { background: #152238; border: 1px solid #1e3a5f; border-radius: 12px; padding: 20px; }
        .card-title { font-size: 0.9rem; color: #8a99ad; margin-bottom: 10px; }
        .card-val { font-size: 2.2rem; font-weight: bold; }
        .card-sub { font-size: 0.8rem; color: #8a99ad; margin-top: 6px; }

        .slots-card { grid-column: span 2; }
        .slots-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .slot-box { background: rgba(255, 255, 255, 0.04); border: 1px solid #1e3a5f; border-radius: 12px; padding: 24px 12px; text-align: center; transition: all 0.3s; }
        .slot-icon { width: 50px; height: 50px; border-radius: 10px; background: #3b82f6; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; margin: 0 auto 12px auto; }
        .slot-box.occupied .slot-icon { background: #ef4444; }
        .slot-name { font-size: 1rem; font-weight: bold; }
        .slot-time { font-size: 0.8rem; color: #8a99ad; margin-top: 4px; }
        .no-data-tag { font-size: 0.85rem; color: #f59e0b; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .slots-card { grid-column: span 1; }
            .slots-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="header-title">🚗 SMART PARKING — ZONE A</div>
            <div class="header-subtitle">ESP32 + MQTT Dashboard</div>
        </div>
        <div class="badge-container">
            <div id="badge-esp32" class="badge badge-offline"><span class="badge-dot"></span> ESP32 OFFLINE</div>
            <div id="badge-mqtt" class="badge badge-offline"><span class="badge-dot"></span> CONNECTED</div>
        </div>
    </div>

    <!-- แถบสรุปตัวเลข 2 การ์ด -->
    <div class="grid">
        <div class="card">
            <div class="card-title">ที่จอดว่าง</div>
            <div class="card-val" id="val-free-slots">— / 4</div>
        </div>
        <div class="card">
            <div class="card-title">รถภายใน</div>
            <div class="card-val" id="val-inside">—</div>
            <div class="card-sub">นับจาก pass เข้า / ออก</div>
        </div>
    </div>

    <!-- แถบแสดงสถานะช่องจอด A1-A4 -->
    <div class="grid">
        <div class="card slots-card">
            <div class="slots-header">
                <div class="card-title" style="font-size: 1.1rem; font-weight: bold; color: white; margin:0;">ช่องจอด A1 — A4</div>
                <div class="no-data-tag" id="slots-status-tag">ไม่มีข้อมูลจาก ESP32</div>
            </div>
            <div class="slots-grid">
                <div class="slot-box" id="slot-box-0">
                    <div class="slot-icon">P</div>
                    <div class="slot-name">A1</div>
                    <div class="slot-time" id="slot-time-0">ว่าง</div>
                </div>
                <div class="slot-box" id="slot-box-1">
                    <div class="slot-icon">P</div>
                    <div class="slot-name">A2</div>
                    <div class="slot-time" id="slot-time-1">ว่าง</div>
                </div>
                <div class="slot-box" id="slot-box-2">
                    <div class="slot-icon">P</div>
                    <div class="slot-name">A3</div>
                    <div class="slot-time" id="slot-time-2">ว่าง</div>
                </div>
                <div class="slot-box" id="slot-box-3">
                    <div class="slot-icon">P</div>
                    <div class="slot-name">A4</div>
                    <div class="slot-time" id="slot-time-3">ว่าง</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const broker = 'wss://broker.hivemq.com:8884/mqtt';
        const topicName = 'ingkarat_smart_parking_2026/data';

        function updateSlotsFromMask(maskStr) {
            const tag = document.getElementById('slots-status-tag');
            if (tag) tag.style.display = 'none';

            for (let i = 0; i < 4; i++) {
                const box = document.getElementById(`slot-box-${i}`);
                const timeElem = document.getElementById(`slot-time-${i}`);
                if (!box) continue;

                const isOccupied = (maskStr && maskStr[i] === '1');
                if (isOccupied) {
                    box.classList.add('occupied');
                    if (timeElem) timeElem.innerText = 'มีรถจอด';
                } else {
                    box.classList.remove('occupied');
                    if (timeElem) timeElem.innerText = 'ว่าง';
                }
            }
        }

        function setOnline(isOnline) {
            const badge = document.getElementById('badge-esp32');
            if (badge) {
                if (isOnline) {
                    badge.className = 'badge badge-online';
                    badge.innerHTML = '<span class="badge-dot"></span> ESP32 ONLINE';
                } else {
                    badge.className = 'badge badge-offline';
                    badge.innerHTML = '<span class="badge-dot"></span> ESP32 OFFLINE';
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof mqtt === 'undefined') {
                console.error('MQTT Library not loaded');
                return;
            }

            const client = mqtt.connect(broker, {
                clientId: 'web_dash_' + Math.random().toString(16).substr(2, 8)
            });

            client.on('connect', () => {
                const mqttBadge = document.getElementById('badge-mqtt');
                if (mqttBadge) {
                    mqttBadge.className = 'badge badge-online';
                    mqttBadge.innerHTML = '<span class="badge-dot"></span> CONNECTED';
                }
                client.subscribe(topicName);
            });

            client.on('message', (t, msg) => {
                setOnline(true);
                try {
                    const data = JSON.parse(msg.toString());
                    
                    if (data.slots !== undefined) {
                        document.getElementById('val-free-slots').innerText = data.slots + ' / 4';
                    }
                    if (data.inside !== undefined) {
                        document.getElementById('val-inside').innerText = data.inside;
                    }
                    if (data.s !== undefined) {
                        updateSlotsFromMask(data.s);
                    }
                } catch (e) {
                    console.error("JSON parse err", e);
                }
            });
        });
    </script>
</body>
</html>
